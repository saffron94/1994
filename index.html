<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFFRON-94 // TERMINAL NODE</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .terminal-box {
            border: 1px solid #00ff66;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin: auto;
            background: #000a03;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #aaffcc;
        }

        button {
            background: #003311;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 16px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:active {
            background: #00ff66;
            color: #050505;
        }

        .nav-matrix {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>SYS.ID: SAFFRON-94</div>
        <div>ONLINE</div>
    </div>

    <div class="terminal-box">
        <h1>Terminal Node 1994</h1>
        <p id="terminal-text">ESTABLISHING SECURE HANDSHAKE...<br>READY FOR CARRIER SIGNAL ACQUISITION.</p>
        
        <button id="action-btn" type="button">[ DIAL IN ]</button>

        <div class="nav-matrix" id="nav-matrix">
            <button type="button" onclick="navigateNode('right')">> TURN RIGHT (090°)</button>
            <button type="button" onclick="navigateNode('right-deep')">> TURN RIGHT // DEEPER NODE</button>
        </div>
    </div>

    <script>
        // Authentic 14.4k Modem Handshake Synthesizer
        function playModemHandshake() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                // 1. Dial tones (DTMF style brief beeps)
                playTone(ctx, 1209, now, 0.1);
                playTone(ctx, 697, now + 0.15, 0.1);

                // 2. Dialing static & noise burst
                playNoiseBurst(ctx, now + 0.4, 0.8);

                // 3. Remote modem answering tone (2100 Hz high tone)
                playTone(ctx, 2100, now + 1.3, 1.0, 0.08, 'sine');

                // 4. V.32bis / V.34 scrambled handshake screeches & training tones
                playTone(ctx, 1200, now + 2.4, 0.6, 0.06, 'sawtooth');
                playTone(ctx, 2400, now + 2.5, 0.5, 0.05, 'square');
                playNoiseBurst(ctx, now + 3.1, 1.2); // Carrier training noise
                playTone(ctx, 1800, now + 4.3, 0.5, 0.06, 'sine');

            } catch (e) {
                console.log('Audio context restricted', e);
            }
        }

        function playTone(ctx, freq, startTime, duration, vol = 0.1, type = 'sine') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            
            gain.gain.setValueAtTime(vol, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playNoiseBurst(ctx, startTime, duration) {
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            // Filter the noise to sound like telephone line static
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1500;
            filter.Q.value = 3;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.08, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            noise.start(startTime);
        }

        // Button Click Event Handler
        document.getElementById('action-btn').addEventListener('click', function() {
            playModemHandshake();

            const textEl = document.getElementById('terminal-text');
            const btnEl = document.getElementById('action-btn');
            const navEl = document.getElementById('nav-matrix');

            btnEl.style.display = 'none';
            textEl.innerHTML = "DIALING 555-1994...<br>SYNCHRONIZING CARRIER SIGNAL...";

            setTimeout(() => {
                textEl.innerHTML = "CONNECT 14400 / ARQ / V32BIS<br>WARNING: SYSTEM PROTOCOL ENFORCES RIGHT-TURN-ONLY TRAVERSAL.";
                navEl.style.display = 'flex';
            }, 5000); // Matches the ~5 second duration of the authentic handshake audio sequence
        });

        function navigateNode(direction) {
            const textEl = document.getElementById('terminal-text');
            textEl.innerHTML = `TRAVERSING VECTOR [${direction.toUpperCase()}]...<br>ROTATING 90 DEGREES CLOCKWISE.`;
            setTimeout(() => {
                textEl.innerHTML = "CURRENT VECTOR: STABLE.<br>CHOOSE NEXT RECURSIVE VECTOR:";
            }, 1200);
        }
    </script>
</body>
</html>
