<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFFRON-94 // TERMINAL NODE</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .terminal-box {
            border: 1px solid #00ff66;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin: auto;
            background: #000a03;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #aaffcc;
        }

        button {
            background: #003311;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 16px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:active {
            background: #00ff66;
            color: #050505;
        }

        .nav-matrix {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>SYS.ID: SAFFRON-94</div>
        <div>ONLINE</div>
    </div>

    <div class="terminal-box">
        <h1>Terminal Node 1994</h1>
        <p id="terminal-text">ESTABLISHING SECURE HANDSHAKE...<br>READY FOR CARRIER SIGNAL ACQUISITION.</p>
        
        <button id="action-btn" type="button">[ DIAL IN ]</button>

        <div class="nav-matrix" id="nav-matrix">
            <button type="button" onclick="navigateNode('right')">> TURN RIGHT (090°)</button>
            <button type="button" onclick="navigateNode('right-deep')">> TURN RIGHT // DEEPER NODE</button>
        </div>
    </div>

    <script>
        // High-fidelity 1994 Dial-up Handshake Synthesizer
        function playAuthenticModem() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                // 1. DTMF Dial Tones (1-9-9-4 sequence digits)
                playDTMF(ctx, 697, 1209, now, 0.08); // 1
                playDTMF(ctx, 770, 1477, now + 0.12, 0.08); // 9
                playDTMF(ctx, 770, 1477, now + 0.24, 0.08); // 9
                playDTMF(ctx, 697, 1336, now + 0.36, 0.08); // 4

                // 2. Line static / dialing noise burst
                playTelephoneNoise(ctx, now + 0.5, 0.6);

                // 3. Remote Modem Answering Tone (2225 Hz bell tone with slight warble)
                playTone(ctx, 2225, now + 1.2, 0.9, 0.07, 'sine');

                // 4. V.32bis High-pitched training screeches (Harsh alternating square/sawtooth waves)
                playScreech(ctx, 1800, 2400, now + 2.1, 0.4, 0.08, 'sawtooth');
                playScreech(ctx, 1200, 2600, now + 2.5, 0.5, 0.08, 'square');

                // 5. Data handshake chatter / fast modulation burst
                playModulationChatter(ctx, now + 3.0, 1.5);

                // 6. Final high carrier tone lock
                playTone(ctx, 2400, now + 4.5, 0.4, 0.05, 'sine');

            } catch (e) {
                console.log('Audio context restricted', e);
            }
        }

        function playTone(ctx, freq, startTime, duration, vol, type) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(vol, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playDTMF(ctx, f1, f2, startTime, duration) {
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();

            osc1.frequency.setValueAtTime(f1, startTime);
            osc2.frequency.setValueAtTime(f2, startTime);
            
            gain.gain.setValueAtTime(0.06, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(startTime);
            osc2.start(startTime);
            osc1.stop(startTime + duration);
            osc2.stop(startTime + duration);
        }

        function playScreech(ctx, startFreq, endFreq, startTime, duration, vol, type) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            
            osc.frequency.setValueAtTime(startFreq, startTime);
            osc.frequency.linearRampToValueAtTime(endFreq, startTime + duration);

            gain.gain.setValueAtTime(vol, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playTelephoneNoise(ctx, startTime, duration) {
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;
            filter.Q.value = 4;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.07, startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            noise.start(startTime);
        }

        function playModulationChatter(ctx, startTime, duration) {
            // Rapid multi-frequency sequence mimicking data packet negotiation
            const steps = 12;
            const stepDuration = duration / steps;
            const freqs = [1200, 2400, 900, 1800, 2100, 1500, 2700, 800, 2200, 1600, 2000, 1100];

            for (let i = 0; i < steps; i++) {
                playTone(ctx, freqs[i], startTime + (i * stepDuration), stepDuration, 0.05, 'sawtooth');
            }
        }

        // Button Click Event Handler
        document.getElementById('action-btn').addEventListener('click', function() {
            playAuthenticModem();

            const textEl = document.getElementById('terminal-text');
            const btnEl = document.getElementById('action-btn');
            const navEl = document.getElementById('nav-matrix');

            btnEl.style.display = 'none';
            textEl.innerHTML = "DIALING 555-1994...<br>HANDSHAKING CARRIER FREQUencies...";

            setTimeout(() => {
                textEl.innerHTML = "CONNECT 14400 / V.32BIS<br>WARNING: SYSTEM PROTOCOL ENFORCES RIGHT-TURN-ONLY TRAVERSAL.";
                navEl.style.display = 'flex';
            }, 5200);
        });

        function navigateNode(direction) {
            const textEl = document.getElementById('terminal-text');
            textEl.innerHTML = `TRAVERSING VECTOR [${direction.toUpperCase()}]...<br>ROTATING 90 DEGREES CLOCKWISE.`;
            setTimeout(() => {
                textEl.innerHTML = "CURRENT VECTOR: STABLE.<br>CHOOSE NEXT RECURSIVE VECTOR:";
            }, 1200);
        }
    </script>
</body>
</html>
