<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFFRON-94 // TERMINAL NODE</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .terminal-box {
            border: 1px solid #00ff66;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            margin: auto;
            background: #000a03;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #aaffcc;
        }

        button {
            background: #003311;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 16px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:active {
            background: #00ff66;
            color: #050505;
        }

        .nav-matrix {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>SYS.ID: SAFFRON-94</div>
        <div>ONLINE</div>
    </div>

    <div class="terminal-box">
        <h1>Terminal Node 1994</h1>
        <p id="terminal-text">ESTABLISHING SECURE HANDSHAKE...<br>READY FOR CARRIER SIGNAL ACQUISITION.</p>
        
        <button id="action-btn" type="button">[ DIAL IN ]</button>

        <div class="nav-matrix" id="nav-matrix">
            <button type="button" onclick="navigateNode('right')">> TURN RIGHT (090°)</button>
            <button type="button" onclick="navigateNode('right-deep')">> TURN RIGHT // DEEPER NODE</button>
        </div>
    </div>

    <!-- Authentic 1994 Modem Dial-up Audio Sample (Embedded Base64 WAV) -->
    <audio id="modem-audio" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <script>
        // Fallback robust Web Audio fallback loader or direct audio sample trigger
        const modemAudio = new Audio('https://upload.wikimedia.org/wikipedia/commons/b/b8/Modem_sound.ogg');
        modemAudio.preload = 'auto';

        document.getElementById('action-btn').addEventListener('click', function() {
            // Play the real audio file
            modemAudio.currentTime = 0;
            modemAudio.play().catch(err => {
                console.log('Audio playback restricted or failed:', err);
            });

            const textEl = document.getElementById('terminal-text');
            const btnEl = document.getElementById('action-btn');
            const navEl = document.getElementById('nav-matrix');

            btnEl.style.display = 'none';
            textEl.innerHTML = "DIALING 555-1994...<br>ACQUIRING CARRIER SIGNAL...";

            // Match duration of typical dialup handshake sample (~5 seconds)
            setTimeout(() => {
                textEl.innerHTML = "CONNECT 14400 / V.32BIS<br>WARNING: SYSTEM PROTOCOL ENFORCES RIGHT-TURN-ONLY TRAVERSAL.";
                navEl.style.display = 'flex';
            }, 5000);
        });

        function navigateNode(direction) {
            const textEl = document.getElementById('terminal-text');
            textEl.innerHTML = `TRAVERSING VECTOR [${direction.toUpperCase()}]...<br>ROTATING 90 DEGREES CLOCKWISE.`;
            setTimeout(() => {
                textEl.innerHTML = "CURRENT VECTOR: STABLE.<br>CHOOSE NEXT RECURSIVE VECTOR:";
            }, 1200);
        }
    </script>
</body>
</html>
